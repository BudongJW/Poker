[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerlab"
version = "0.2.0"
description = "Hold'em equity calculator, opponent range inference and bot self-play"
readme = "pokerlab/README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
claude = ["anthropic>=2", "pillow"]   # reading windows with Claude (Pillow: the board read again, enlarged)
dev = ["pytest", "pillow"]     # the tests, and the tools in pokerlab/tools

[project.scripts]
pokerlab = "pokerlab.__main__:main"

[tool.setuptools]
packages = ["pokerlab"]

[tool.setuptools.package-data]
pokerlab = ["data/*.json", "data/*.jpg", "data/formats/*.json", "data/formats/source/*.csv", "static/*.html"]
