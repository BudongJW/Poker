<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pokerlab 승률 계산기</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.05);
  --pos: #2a78d6; --neg: #e34948; --mid: #f0efec; --quiet: #c3c2b7; --on-strong: #ffffff;
  --seq-1: #cde2fb; --seq-2: #86b6ef; --seq-3: #3987e5; --seq-4: #1c5cab; --seq-5: #0d366b;
  --seq-ink-1: #0b0b0b; --seq-ink-2: #0b0b0b; --seq-ink-3: #ffffff; --seq-ink-4: #ffffff; --seq-ink-5: #ffffff;
  --suit-s: #0b0b0b; --suit-h: #c8372d; --suit-d: #1c5cab; --suit-c: #0f7a2e;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --pos: #3987e5; --neg: #e66767; --mid: #383835; --quiet: #52514e; --on-strong: #ffffff;
    --seq-1: #0d366b; --seq-2: #1c5cab; --seq-3: #3987e5; --seq-4: #86b6ef; --seq-5: #cde2fb;
    --seq-ink-1: #ffffff; --seq-ink-2: #ffffff; --seq-ink-3: #ffffff; --seq-ink-4: #0b0b0b; --seq-ink-5: #0b0b0b;
    --suit-s: #f0efec; --suit-h: #f08a80; --suit-d: #86b6ef; --suit-c: #5cc27a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px;
  grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
h1 { grid-column: 1 / -1; font-size: 18px; margin: 0; font-weight: 650; }
h1 small { font-weight: 400; color: var(--ink-2); font-size: 13px; margin-left: 8px; }
h2 { font-size: 13px; margin: 0 0 8px; font-weight: 650; }
h2 small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.card-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hint { color: var(--ink-2); font-size: 12.5px; margin: 0; }
button, select, input { font: inherit; color: inherit; }
input[type=text], input[type=number], select { background: var(--surface); border: 1px solid var(--baseline);
  border-radius: 6px; padding: 5px 8px; min-width: 0; }
input[type=number] { width: 84px; }
.btn { background: var(--surface); border: 1px solid var(--baseline); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:hover { background: var(--wash); }
:focus-visible { outline: 2px solid var(--pos); outline-offset: 1px; }

/* cards */
.slots { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
.slot-group { display: grid; gap: 4px; }
.slot-group > span { font-size: 12px; color: var(--ink-2); }
.slot-group > div { display: flex; gap: 4px; }
.slot { width: 42px; height: 56px; border-radius: 6px; border: 1px dashed var(--baseline); background: var(--surface);
  font-size: 17px; font-weight: 650; cursor: pointer; padding: 0; }
.slot.filled { border-style: solid; }
.slot.active { border: 2px solid var(--pos); }
.gap { width: 10px; }
.picker { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; }
.pick { height: 34px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface);
  font-size: 13px; font-weight: 650; cursor: pointer; padding: 0; }
.pick:hover:not(:disabled) { background: var(--wash); }
.pick:disabled { opacity: 0.22; cursor: default; }
.suit-s { color: var(--suit-s); } .suit-h { color: var(--suit-h); } .suit-d { color: var(--suit-d); } .suit-c { color: var(--suit-c); }
.opponent { border-top: 1px solid var(--grid); padding-top: 8px; display: grid; gap: 6px; }
.streets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.streets select { width: 100%; }
.streets select + select { margin-top: 3px; font-size: 12.5px; }
@media (max-width: 480px) { .streets { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pick { font-size: 11.5px; } }
.opponent input[type=text] { flex: 1; }
label.field { display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); }

/* results */
#result.loading { opacity: 0.55; }
.hero { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hero .figure { font-size: 56px; font-weight: 650; line-height: 1; letter-spacing: -0.02em; }
.hero .label { color: var(--ink-2); }
.chip { display: inline-block; border: 1px solid var(--baseline); border-radius: 999px; padding: 1px 10px; font-weight: 650; }
.facts { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.facts b { font-weight: 650; }
.error { color: var(--ink); border-left: 3px solid var(--neg); padding-left: 10px; }

.segbar { display: flex; gap: 2px; height: 28px; }
.seg { border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: 12.5px; font-weight: 650;
  white-space: nowrap; overflow: visible; min-width: 0; }
.seg.win { background: var(--pos); color: var(--on-strong); }
.seg.tie { background: var(--quiet); color: var(--ink); }
.seg.lose { background: var(--neg); color: var(--on-strong); }
.legend { display: flex; gap: 14px; color: var(--ink-2); font-size: 12.5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.bars .name { color: var(--ink-2); font-size: 13px; }
.bars .track { display: flex; align-items: center; gap: 8px; }
.bars .bar { height: 14px; background: var(--pos); border-radius: 0 4px 4px 0; min-width: 2px; }
.bars .value { font-variant-numeric: tabular-nums; font-size: 12.5px; }

.columns { display: flex; align-items: flex-end; gap: 10px; height: 120px; border-bottom: 1px solid var(--baseline); padding-top: 18px; }
.columns .col { flex: 1; max-width: 24px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; }
.columns .col .fill { background: var(--quiet); border-radius: 4px 4px 0 0; min-height: 2px; }
.columns .col.current .fill { background: var(--pos); }
.columns .col .cap { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 650; white-space: nowrap; }
.axis { display: flex; gap: 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 3px; }
.axis span { flex: 1; max-width: 24px; text-align: center; }

.cardgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; }
.cell { height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px;
  font-weight: 650; background: var(--mid); color: var(--ink); }
.cell.off { background: transparent; color: var(--muted); font-weight: 400; opacity: 0.45; }
.cell.p1 { background: color-mix(in oklab, var(--pos) 35%, var(--mid)); }
.cell.p2 { background: color-mix(in oklab, var(--pos) 68%, var(--mid)); }
.cell.p3 { background: var(--pos); color: var(--on-strong); }
.cell.n1 { background: color-mix(in oklab, var(--neg) 35%, var(--mid)); }
.cell.n2 { background: color-mix(in oklab, var(--neg) 68%, var(--mid)); }
.cell.n3 { background: var(--neg); color: var(--on-strong); }
.cell:hover, .cell:focus-visible, .seg:hover, .col:hover .fill, .bars .bar:hover { filter: brightness(1.12); }
.scale { display: flex; gap: 2px; align-items: center; }
.scale i { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }

.rangegrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; max-width: 470px; }
.rangegrid .cell { height: 26px; font-size: 10.5px; font-weight: 500; background: transparent; color: var(--muted); }
.rangegrid .s1 { background: var(--seq-1); color: var(--seq-ink-1); } .rangegrid .s2 { background: var(--seq-2); color: var(--seq-ink-2); }
.rangegrid .s3 { background: var(--seq-3); color: var(--seq-ink-3); } .rangegrid .s4 { background: var(--seq-4); color: var(--seq-ink-4); }
.rangegrid .s5 { background: var(--seq-5); color: var(--seq-ink-5); }

details { color: var(--ink-2); font-size: 12.5px; }
details summary { cursor: pointer; }
table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
td, th { padding: 2px 10px 2px 0; text-align: left; font-weight: 400; }
th { color: var(--muted); }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 5px 9px; border-radius: 6px;
  font-size: 12.5px; z-index: 10; display: none; max-width: 260px; }
#tip b { font-weight: 650; margin-right: 6px; }
</style>
</head>
<body>
<main>
  <h1>승률 계산기 <small>텍사스 홀덤 · 학습/복기용</small></h1>

  <section class="card-box stack" aria-label="입력">
    <div class="slots" id="slots"></div>
    <div class="picker" id="picker" aria-label="카드 선택"></div>
    <div class="row">
      <label class="field">판에 남은 인원(나 포함)
        <select id="players"></select>
      </label>
      <label class="field">테이블
        <select id="table">
          <option value="2">1:1</option>
          <option value="6" selected>6인</option>
          <option value="9">9인</option>
        </select>
      </label>
      <label class="field">내 포지션
        <select id="position"></select>
      </label>
      <label class="field">정밀도
        <select id="quality">
          <option value="fast">빠름 · 5만 회</option>
          <option value="normal" selected>보통 · 20만 회</option>
          <option value="precise">정밀 · ±0.1%p</option>
          <option value="ultra">초정밀 · ±0.05%p</option>
        </select>
      </label>
      <button class="btn" id="reset" type="button" style="margin-left:auto;align-self:flex-end">초기화</button>
    </div>
    <div class="row">
      <label class="field">팟 <input type="number" id="pot" min="0" step="any" placeholder="예: 100"></label>
      <label class="field">콜 금액 <input type="number" id="toCall" min="0" step="any" placeholder="예: 50"></label>
      <label class="field">내 베팅 <input type="number" id="bet" min="0" step="any" placeholder="예: 75"></label>
    </div>
    <div class="stack" style="gap:8px">
      <div class="row">
        <h2 style="margin:0">상대 설정 <small>지정하지 않은 상대는 랜덤 핸드</small></h2>
        <button class="btn" id="addOpponent" type="button" style="margin-left:auto">상대 추가</button>
      </div>
      <label class="field">액션을 해석할 모델 (어떤 플레이어들의 습관으로 레인지를 추정할지)
        <select id="model">
          <option value="online:all">실전 온라인 2009 · 전체</option>
          <option value="online:nl25-50">실전 온라인 · 25~50NL</option>
          <option value="online:nl100-200">실전 온라인 · 100~200NL</option>
          <option value="online:nl400-600">실전 온라인 · 400~600NL</option>
          <option value="online:nl1000">실전 온라인 · 1000NL</option>
          <option value="pro:all">프로와 Pluribus (6인)</option>
          <option value="selfplay:all">이 프로그램의 봇</option>
        </select>
      </label>
      <div id="opponents" class="stack" style="gap:8px"></div>
    </div>
  </section>

  <section class="stack" id="result" aria-live="polite">
    <div class="card-box"><p class="hint">내 카드 두 장을 고르면 계산합니다. 보드는 비워 두거나 3·4·5장을 고르세요.</p></div>
  </section>
</main>
<div id="tip" role="tooltip"></div>

<script>
"use strict";
const RANKS = "AKQJT98765432", SUITS = "shdc", SYMBOL = {s: "♠", h: "♥", d: "♦", c: "♣"};
const SLOT_NAMES = ["내 핸드", "플랍", "턴", "리버"];
const HAND_KO = {"high card": "하이카드", "pair": "원페어", "two pair": "투페어", "three of a kind": "트리플",
  "straight": "스트레이트", "flush": "플러시", "full house": "풀하우스", "four of a kind": "포카드",
  "straight flush": "스트레이트 플러시"};
const PREFLOP_ACTIONS = [["", "—"], ["limp", "림프"], ["open", "오픈 레이즈"], ["call", "레이즈에 콜"], ["3bet", "3벳"],
  ["call3bet", "3벳에 콜"], ["4bet", "4벳"], ["check", "체크(BB)"]];
const POSTFLOP_ACTIONS = [["", "—"], ["check", "체크"], ["bet", "벳"], ["call", "콜"], ["raise", "레이즈"],
  ["check call", "체크 후 콜"], ["check raise", "체크레이즈"], ["bet callraise", "벳 후 레이즈에 콜"], ["reraise", "리레이즈"]];
const STREETS = ["프리플랍", "플랍", "턴", "리버"];
// bet sizes the model tells apart, as a share of the pot; a pre-flop open (or the open that was called) in big blinds
const SIZES = [["", "크기 모름"], ["33", "작게 (팟 45% 미만)"], ["66", "보통 (45~90%)"], ["100", "크게 (90% 이상)"]];
const OPEN_SIZES = [["", "크기 모름"], ["2x", "작게 (2bb)"], ["2.5x", "보통 (2.5~3bb)"], ["3.5x", "크게 (3.5bb 이상)"]];
function sizeOptions(street, action) {
  return street === 0 && ["open", "call"].includes(sizedWord(action)) ? OPEN_SIZES : SIZES;
}
const BETTING = ["open", "3bet", "4bet", "bet", "raise", "reraise"], CALLING = ["call", "call3bet", "callraise"];
// the word of a street's action that a size belongs to: the bet or raise if there is one, else the call
function sizedWord(action) {
  const words = action.split(" ");
  return words.find(w => BETTING.includes(w)) || words.find(w => CALLING.includes(w)) || "";
}
function withSize(action, size) {
  const target = sizedWord(action);
  return size && target ? action.split(" ").map(w => w === target ? w + size : w).join(" ") : action;
}
const SEATS = [["", "모름"], ["ep", "얼리(UTG)"], ["mp", "미들(HJ)"], ["co", "컷오프"], ["btn", "버튼"], ["sb", "스몰 블라인드"], ["bb", "빅 블라인드"]];
function seatSelect(value, onchange) {
  const sel = el("select");
  for (const [v, t] of SEATS) { const o = el("option", null, t); o.value = v; sel.append(o); }
  sel.value = value; sel.onchange = () => onchange(sel.value);
  return sel;
}

const state = {slots: Array(7).fill(null), active: 0, players: 2, opponents: [], seq: 0, timer: null};
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pct = (x, digits = 1) => (x * 100).toFixed(digits) + "%";
const cardLabel = card => (card[0] === "T" ? "10" : card[0]) + SYMBOL[card[1]];

/* ---- tooltip: values lead, labels follow; text only ---- */
const tip = $("tip");
function attachTip(node, value, label) {
  node.tabIndex = 0;
  const show = (x, y) => {
    tip.replaceChildren(el("b", null, value), document.createTextNode(label));
    tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(4, Math.min(x + 12, innerWidth - w - 4)) + "px";
    tip.style.top = Math.max(4, y - h - 10) + "px";
  };
  node.addEventListener("pointermove", e => show(e.clientX, e.clientY));
  node.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  node.addEventListener("focus", () => { const r = node.getBoundingClientRect(); show(r.left + r.width / 2, r.top); });
  node.addEventListener("blur", () => { tip.style.display = "none"; });
}

/* ---- input: card slots and picker ---- */
function renderSlots() {
  const root = $("slots"); root.replaceChildren();
  [[0, 1], [2, 3, 4], [5], [6]].forEach((indexes, g) => {
    const group = el("div", "slot-group"); group.append(el("span", null, SLOT_NAMES[g]));
    const box = el("div");
    for (const i of indexes) {
      const card = state.slots[i];
      const b = el("button", "slot" + (card ? " filled suit-" + card[1] : "") + (i === state.active ? " active" : ""), card ? cardLabel(card) : "");
      b.type = "button";
      b.setAttribute("aria-label", SLOT_NAMES[g] + (card ? " " + cardLabel(card) + " (누르면 지움)" : " 빈 칸"));
      b.onclick = () => { if (card) state.slots[i] = null; state.active = i; renderInput(); schedule(); };
      box.append(b);
    }
    group.append(box); root.append(group);
    if (g === 0) root.append(el("div", "gap"));
  });
}
function renderPicker() {
  const root = $("picker"); root.replaceChildren();
  for (const s of SUITS) for (const r of RANKS) {
    const card = r + s, b = el("button", "pick suit-" + s, cardLabel(card));
    b.type = "button"; b.disabled = state.slots.includes(card);
    b.onclick = () => {
      if (state.active == null) return;
      state.slots[state.active] = card;
      const next = state.slots.indexOf(null);
      state.active = next === -1 ? null : next;
      renderInput(); schedule();
    };
    root.append(b);
  }
}
function boardStreet() {           // 0 preflop .. 3 river, or -1 if the board is incomplete
  const board = state.slots.slice(2), n = board.filter(Boolean).length;
  if (board.slice(0, n).some(c => !c)) return -1;      // gaps
  return {0: 0, 3: 1, 4: 2, 5: 3}[n] ?? -1;
}

/* ---- input: opponents ---- */
function renderOpponents() {
  const root = $("opponents"); root.replaceChildren();
  const street = Math.max(boardStreet(), 0);
  state.opponents = state.opponents.slice(0, state.players - 1);
  $("addOpponent").disabled = state.opponents.length >= state.players - 1;
  state.opponents.forEach((opp, i) => {
    const box = el("div", "opponent"), head = el("div", "row");
    head.append(el("b", null, "상대 " + (i + 1)));
    const kind = el("select");
    for (const [v, t] of [["line", "액션으로 추정"], ["range", "레인지 직접 입력"], ["cards", "카드 지정"]]) {
      const o = el("option", null, t); o.value = v; kind.append(o);
    }
    kind.value = opp.type; kind.style.maxWidth = "150px";
    kind.onchange = () => { opp.type = kind.value; renderOpponents(); schedule(); };
    const remove = el("button", "btn", "삭제"); remove.type = "button"; remove.style.marginLeft = "auto";
    remove.onclick = () => { state.opponents.splice(i, 1); renderOpponents(); schedule(); };
    head.append(kind, remove); box.append(head);
    if (opp.type === "line") {
      const seat = el("label", "field", "상대 포지션 (알면 레인지가 더 정확해집니다)");
      seat.append(seatSelect(opp.position || "", v => { opp.position = v; schedule(); }));
      box.append(seat);
      const row = el("div", "streets");
      STREETS.forEach((name, s) => {
        const field = el("label", "field", name), sel = el("select"), size = el("select");
        for (const [v, t] of (s === 0 ? PREFLOP_ACTIONS : POSTFLOP_ACTIONS)) { const o = el("option", null, t); o.value = v; sel.append(o); }
        for (const [v, t] of sizeOptions(s, opp.streets[s])) { const o = el("option", null, t); o.value = v; size.append(o); }
        sel.value = opp.streets[s]; sel.disabled = s > street;
        size.value = opp.sizes[s]; size.disabled = s > street || !sizedWord(opp.streets[s]);
        size.setAttribute("aria-label", name + " 벳 크기");
        sel.onchange = () => {
          opp.streets[s] = sel.value;
          if (!sizeOptions(s, sel.value).some(([v]) => v === opp.sizes[s])) opp.sizes[s] = "";   // a size the new action cannot have
          renderOpponents(); schedule();
        };
        size.onchange = () => { opp.sizes[s] = size.value; schedule(); };
        field.append(sel, size); row.append(field);
      });
      box.append(row, el("p", "hint", "크기: 벳·레이즈는 그 크기, 콜은 받은 벳의 크기 (팟 대비)"));
    } else {
      const input = el("input"); input.type = "text"; input.value = opp.text;
      input.placeholder = opp.type === "range" ? "예: TT+, AQs+, KQs  또는  15%" : "예: QhQd";
      input.oninput = () => { opp.text = input.value; schedule(600); };
      box.append(input);
    }
    root.append(box);
  });
}
function renderInput() { renderSlots(); renderPicker(); renderOpponents(); }

/* ---- request ---- */
function schedule(delay = 200) { clearTimeout(state.timer); state.timer = setTimeout(request, delay); }
async function request() {
  const [h1, h2] = state.slots, street = boardStreet(), result = $("result");
  if (!h1 || !h2) return;
  if (street < 0) { renderMessage("보드는 비워 두거나 플랍 3장, 턴, 리버 순서로 채워 주세요."); return; }
  const quality = {fast: {trials: 50000}, normal: {trials: 200000}, precise: {precision: 0.001}, ultra: {precision: 0.0005}}[$("quality").value];
  const opponents = state.opponents.map(o => o.type === "line"
    ? {type: "line", position: o.position || "",
       value: o.streets.slice(0, street + 1).map((a, i) => withSize(a, o.sizes[i])).join("/").replace(/\/+$/, "")}
    : {type: o.type, value: o.text});
  const [model, profile] = $("model").value.split(":");
  const body = {hand: h1 + h2, board: state.slots.slice(2).filter(Boolean).join(""), players: state.players,
    opponents, pot: $("pot").value, to_call: $("toCall").value, bet: $("bet").value, model, profile,
    position: $("position").value, table: Math.max(Number($("table").value), state.players), ...quality};
  const seq = ++state.seq;
  result.classList.add("loading");
  try {
    const response = await fetch("/api/analyze", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const data = await response.json();
    if (seq !== state.seq) return;                    // a newer request is on its way
    if (data.error) renderMessage(data.error, true); else renderResult(data);
  } catch (e) {
    if (seq === state.seq) renderMessage("서버에 연결할 수 없습니다: " + e.message, true);
  } finally {
    if (seq === state.seq) result.classList.remove("loading");
  }
}
function renderMessage(text, isError) {
  const box = el("div", "card-box"); box.append(el("p", isError ? "error" : "hint", text));
  $("result").replaceChildren(box);
}

/* ---- results ---- */
function section(title, note) {
  const box = el("div", "card-box"), h = el("h2", null, title);
  if (note) h.append(el("small", null, note));
  box.append(h); return box;
}
function fact(label, text) { const li = el("li"); li.append(el("b", null, label + " "), document.createTextNode(text)); return li; }

function renderResult(d) {
  const out = [], nOpp = d.n_players - 1;

  /* headline */
  const head = el("div", "card-box stack");
  const hero = el("div", "hero");
  hero.append(el("span", "figure", pct(d.equity)), el("span", "label", "승률(에퀴티) · " +
    (d.exact ? "전수 계산, 오차 없음" : `몬테카를로 ${d.trials.toLocaleString()}회, ±${(d.ci95 * 100).toFixed(2)}%p`)));
  head.append(hero);
  const verdict = el("div", "row");
  verdict.append(el("span", "chip", d.verdict), el("span", "hint",
    `${d.n_players}명 기준 평균 승률 ${pct(d.fair_share)}의 ${(d.equity / d.fair_share).toFixed(2)}배 · 상대 ${nOpp}명 ${d.ranged ? "(레인지 반영)" : "(랜덤 핸드 가정)"}`));
  head.append(verdict);
  const bar = el("div", "segbar"); bar.setAttribute("role", "img");
  bar.setAttribute("aria-label", `승 ${pct(d.win)}, 무 ${pct(d.tie)}, 패 ${pct(d.lose)}`);
  for (const [cls, name, v] of [["win", "승", d.win], ["tie", "무", d.tie], ["lose", "패", d.lose]]) {
    if (v <= 0) continue;
    const seg = el("div", "seg " + cls, v >= 0.09 ? pct(v) : "");
    seg.style.flex = `${v} 1 0`; attachTip(seg, pct(v, 2), name); bar.append(seg);
  }
  const legend = el("div", "legend");
  for (const [name, color] of [["승", "var(--pos)"], ["무(팟 분배)", "var(--quiet)"], ["패", "var(--neg)"]]) {
    const item = el("span"), sw = el("i", "swatch"); sw.style.background = color; item.append(sw, document.createTextNode(name)); legend.append(item);
  }
  head.append(bar, legend);

  const facts = el("ul", "facts");
  if (d.made_hand) facts.append(fact("현재 족보", `${HAND_KO[d.made_hand]} · 지금 쇼다운이면 랜덤 핸드 1개 상대로 앞섬 ${pct(d.ahead_now[0])} / 동률 ${pct(d.ahead_now[1])} / 뒤짐 ${pct(d.ahead_now[2])}`));
  if (d.preflop_rank) facts.append(fact("프리플랍 순위", `169개 스타팅 핸드 중 ${d.preflop_rank}위 (${d.hand_class})`));
  if (d.pot_odds) facts.append(fact("팟 오즈", `팟 ${d.pot_odds.pot}에 ${d.pot_odds.to_call} 콜 → 필요 승률 ${pct(d.pot_odds.required_equity)} · 콜 기대값 ${d.pot_odds.ev_call >= 0 ? "+" : ""}${d.pot_odds.ev_call.toFixed(1)} (${d.pot_odds.profitable ? "수익" : "손실"} 콜)`));
  if (d.bet) {
    facts.append(fact("베팅", `팟 ${d.bet.pot}에 ${d.bet.bet} → 블러프 손익분기 폴드율 ${pct(d.bet.bluff_breakeven_folds)} · 콜 받을 때 필요 승률 ${pct(d.bet.called_breakeven_equity)}`));
    facts.append(fact("베팅 기대값", `현재 승률 그대로 콜 받으면 ${d.bet.ev_if_called >= 0 ? "+" : ""}${d.bet.ev_if_called.toFixed(1)} · 체크로 쇼다운이면 +${d.bet.ev_check.toFixed(1)}`));
  }
  if (!d.ranged) facts.append(fact("주의", "상대가 랜덤 핸드라는 가정입니다. 베팅·레이즈한 상대는 '상대 추가'로 액션을 넣으면 레인지를 추정해 다시 계산합니다."));
  head.append(facts); out.push(head);

  /* opponent ranges: sequential, one hue */
  d.ranges.forEach((r, i) => {
    const box = section(`상대 ${i + 1} 레인지`, `${r.label} · 전체 핸드의 약 ${pct(r.width, 0)} 폭`);
    const grid = el("div", "rangegrid"); grid.setAttribute("role", "img"); grid.setAttribute("aria-label", "스타팅 핸드별 비중");
    const density = cls => r.classes[cls] / (cls.length === 2 ? 6 : cls.endsWith("s") ? 4 : 12);
    const peak = Math.max(...Object.keys(r.classes).map(density));
    for (let a = 0; a < 13; a++) for (let b = 0; b < 13; b++) {
      const cls = a === b ? RANKS[a] + RANKS[a] : a < b ? RANKS[a] + RANKS[b] + "s" : RANKS[b] + RANKS[a] + "o";
      const share = r.classes[cls] || 0, level = share > 0 ? Math.min(5, 1 + Math.floor(density(cls) / peak * 4.999)) : 0;
      const cell = el("div", "cell" + (level && density(cls) / peak >= 0.04 ? " s" + level : ""), cls);
      attachTip(cell, pct(share, 2), `${cls} · 레인지에서 차지하는 비중`); grid.append(cell);
    }
    const legend = el("div", "legend"), scale = el("span", "scale");
    for (let s = 1; s <= 5; s++) { const sw = el("i"); sw.style.background = `var(--seq-${s})`; scale.append(sw); }
    legend.append(document.createTextNode("콤보당 비중 낮음"), scale, document.createTextNode("높음"),
      el("span", null, "비중 상위: " + r.top.slice(0, 6).map(([cls, share]) => `${cls} ${pct(share, 0)}`).join(", ")));
    box.append(grid, legend); out.push(box);
  });

  /* next card: diverging around the current equity */
  if (d.next_cards) {
    const nc = d.next_cards, box = section("다음 카드별 승률", `현재 ${pct(d.equity)} 대비 · 10%p 이상 오르는 카드 ${nc.better}장, 떨어지는 카드 ${nc.worse}장`);
    const grid = el("div", "cardgrid");
    for (const s of SUITS) for (const r of RANKS) {
      const card = r + s, e = nc.cards[card];
      if (e == null) { grid.append(el("div", "cell off", cardLabel(card))); continue; }
      const delta = e - d.equity, size = Math.abs(delta) < 0.03 ? 0 : Math.abs(delta) < 0.10 ? 1 : Math.abs(delta) < 0.25 ? 2 : 3;
      const cell = el("div", "cell" + (size ? (delta > 0 ? " p" : " n") + size : ""), cardLabel(card));
      attachTip(cell, pct(e), `${cardLabel(card)} 이후 승률 (${delta >= 0 ? "+" : ""}${(delta * 100).toFixed(1)}%p)`); grid.append(cell);
    }
    const legend = el("div", "legend"), scale = el("span", "scale");
    for (const c of ["var(--neg)", "color-mix(in oklab, var(--neg) 68%, var(--mid))", "color-mix(in oklab, var(--neg) 35%, var(--mid))", "var(--mid)",
      "color-mix(in oklab, var(--pos) 35%, var(--mid))", "color-mix(in oklab, var(--pos) 68%, var(--mid))", "var(--pos)"]) { const sw = el("i"); sw.style.background = c; scale.append(sw); }
    legend.append(document.createTextNode("승률 하락"), scale, document.createTextNode("상승 (±3 / 10 / 25%p 경계)"));
    const groups = el("ul", "facts"); groups.style.marginTop = "8px";
    for (const g of nc.groups) groups.append(fact(`${HAND_KO[g.made_hand]} ${g.cards.length}장`, `→ 평균 승률 ${pct(g.equity)}  (${g.cards.map(cardLabel).join(" ")})`));
    const details = el("details"); details.append(el("summary", null, "표로 보기"));
    const table = el("table"), headRow = el("tr"); headRow.append(el("th", null, "카드"), el("th", null, "이후 승률"), el("th", null, "변화")); table.append(headRow);
    for (const [card, e] of Object.entries(nc.cards).sort((x, y) => y[1] - x[1])) {
      const tr = el("tr"); tr.append(el("td", null, cardLabel(card)), el("td", null, pct(e)), el("td", null, ((e - d.equity) * 100).toFixed(1) + "%p")); table.append(tr);
    }
    details.append(table); box.append(grid, legend, groups, details); out.push(box);
  }

  /* final hand distribution: ranked bars, one hue */
  if (d.board.length < 5) {
    const box = section("리버까지 갔을 때 내 최종 족보"), bars = el("div", "bars");
    const rows = Object.entries(d.hand_dist).sort((x, y) => y[1] - x[1]).filter(([, p]) => p >= 0.0005), top = rows[0][1];
    for (const [name, p] of rows) {
      const track = el("div", "track"), barEl = el("div", "bar"); barEl.style.width = `calc((100% - 56px) * ${p / top})`;
      attachTip(barEl, pct(p, 2), HAND_KO[name]); track.append(barEl, el("span", "value", pct(p)));
      bars.append(el("div", "name", HAND_KO[name]), track);
    }
    box.append(bars); out.push(box);
  }

  /* equity by number of opponents: the current count is the point, the rest is context */
  if (d.by_opponents) {
    const box = section("상대 수별 승률", "같은 핸드·보드, 상대가 모두 랜덤 핸드일 때"), cols = el("div", "columns"), axis = el("div", "axis");
    const entries = Object.entries(d.by_opponents), top = Math.max(...entries.map(([, e]) => e));
    for (const [n, e] of entries) {
      const col = el("div", "col" + (Number(n) === nOpp ? " current" : "")), fill = el("div", "fill");
      fill.style.height = (e / top * 100) + "%";
      if (Number(n) === nOpp) { const cap = el("span", "cap", pct(e, 0)); cap.style.bottom = `calc(${e / top * 100}% + 2px)`; col.append(cap); }
      attachTip(col, pct(e), `상대 ${n}명`); col.append(fill); cols.append(col); axis.append(el("span", null, n));
    }
    box.append(cols, axis, el("p", "hint", "가로축: 상대 수(명)")); out.push(box);
  }
  $("result").replaceChildren(...out);
}

/* ---- wiring ---- */
for (let n = 2; n <= 10; n++) { const o = el("option", null, n + "명"); o.value = n; $("players").append(o); }
$("players").onchange = () => { state.players = Number($("players").value); renderOpponents(); schedule(); };
$("quality").onchange = () => schedule();
$("model").onchange = () => schedule();
for (const id of ["pot", "toCall", "bet"]) $(id).oninput = () => schedule(500);
$("addOpponent").onclick = () => { state.opponents.push({type: "line", streets: ["", "", "", ""], sizes: ["", "", "", ""], text: "", position: ""}); renderOpponents(); };
for (const [v, t] of SEATS) { const o = el("option", null, t); o.value = v; $("position").append(o); }
$("position").onchange = () => schedule();
$("table").onchange = () => schedule();
$("reset").onclick = () => {
  state.slots.fill(null); state.active = 0; state.opponents = []; state.seq++;
  for (const id of ["pot", "toCall", "bet", "position"]) $(id).value = "";
  renderInput(); renderMessage("내 카드 두 장을 고르면 계산합니다. 보드는 비워 두거나 3·4·5장을 고르세요.");
};
renderInput();
</script>
</body>
</html>
